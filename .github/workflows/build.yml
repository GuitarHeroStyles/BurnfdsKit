name: Build APK

on:
  push:
    branches: [Baklava]
    tags: ['v*']
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: gradle/actions/setup-gradle@v4

      # Optional: add these repository secrets to sign with your own key.
      #   KEYSTORE_BASE64  (base64 of your .jks/.p12), KEYSTORE_PASSWORD, KEY_ALIAS, KEY_PASSWORD
      # Without them the APK is signed with a debug key (fine for testing, but a different key each build).
      - name: Prepare signing
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: |
          if [ -n "$KEYSTORE_BASE64" ]; then
            echo "$KEYSTORE_BASE64" | base64 -d > "$RUNNER_TEMP/release.jks"
            mkdir -p "$HOME/.gradle"
            {
              echo "STORE_FILE=$RUNNER_TEMP/release.jks"
              echo "STORE_PASSWORD=$KEYSTORE_PASSWORD"
              echo "KEY_ALIAS=$KEY_ALIAS"
              echo "KEY_PASSWORD=$KEY_PASSWORD"
            } >> "$HOME/.gradle/gradle.properties"
            echo "Signing with the provided keystore"
          else
            echo "No keystore secret, using the debug key"
          fi

      - name: Build release APK
        run: bash ./gradlew :firefdskit:assembleRelease --no-daemon

      - uses: actions/upload-artifact@v4
        with:
          name: BurnfdsKit-APK
          path: firefdskit/build/outputs/apk/release/*.apk

      - name: Publish GitHub Release (tags only)
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: firefdskit/build/outputs/apk/release/*.apk
          generate_release_notes: true
